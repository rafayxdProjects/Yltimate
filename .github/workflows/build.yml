
name: Build Yltimate

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build mod
        run: |
          PROJECT_DIR=$(find . -name build.gradle -not -path '*/.gradle/*' -print -quit | xargs dirname)
          gradle -p "$PROJECT_DIR" build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Yltimate-Client-JAR
          path: '**/build/libs/*.jar'
          if-no-files-found: error
          
